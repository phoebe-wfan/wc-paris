<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="WC Paris — codes et informations communautaires sur les toilettes des fast-foods et cafés à Paris.">
  <meta name="theme-color" content="#111111">
  <title>WC Paris — Codes</title>

  <style>
    :root{
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color-scheme:light dark;
      --bg:light-dark(#f7f7f4,#10110f);
      --card:light-dark(#fff,#191a17);
      --text:light-dark(#171814,#f3f4ee);
      --muted:light-dark(#74766d,#a9ada2);
      --line:light-dark(#e5e6df,#30322c);
      --accent:#111;
      --pill:light-dark(#f0f1ea,#292b25);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
    }

    #app{
      min-height:100vh;
      background:var(--bg);
    }

    header{
      padding:28px 22px 18px;
      max-width:1100px;
      margin:auto;
    }

    h1{
      font-size:30px;
      letter-spacing:-.04em;
      margin:0 0 7px;
    }

    .sub{
      color:var(--muted);
      font-size:14px;
    }

    .bar{
      display:flex;
      gap:9px;
      margin-top:20px;
      flex-wrap:wrap;
    }

    input,select,button{
      border:1px solid var(--line);
      background:var(--card);
      color:var(--text);
      border-radius:12px;
      padding:11px 13px;
      font:inherit;
    }

    input{
      flex:1;
      min-width:220px;
    }

    button{
      cursor:pointer;
    }

    .brands{
      display:flex;
      gap:7px;
      overflow:auto;
      padding:0 22px 12px;
      max-width:1100px;
      margin:auto;
    }

    .brand.active{
      background:#111;
      color:white;
      border-color:#111;
    }

    .brand{
      white-space:nowrap;
    }

    .stats{
      max-width:1100px;
      margin:0 auto;
      padding:4px 22px 15px;
      color:var(--muted);
      font-size:13px;
    }

    .grid{
      max-width:1100px;
      margin:auto;
      padding:0 22px 40px;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:12px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      padding:16px;
      box-shadow:0 2px 8px #00000008;
    }

    .top{
      display:flex;
      justify-content:space-between;
      gap:10px;
    }

    .logo{
      font-size:12px;
      font-weight:800;
      padding:6px 8px;
      background:var(--pill);
      border-radius:9px;
      height:max-content;
    }

    .name{
      font-weight:750;
      font-size:17px;
    }

    .addr{
      color:var(--muted);
      font-size:13px;
      margin-top:3px;
    }

    .code{
      font-size:29px;
      font-weight:850;
      letter-spacing:.08em;
      margin:17px 0 4px;
    }

    .unknown{
      font-size:17px;
      color:var(--muted);
      font-weight:650;
    }

    .meta{
      font-size:12px;
      color:var(--muted);
    }

    .row{
      display:flex;
      gap:8px;
      margin-top:13px;
    }

    .row button{
      flex:1;
    }

    .update-form{
      display:flex;
      gap:8px;
      margin-top:10px;
    }

    .update-form input{
      min-width:0;
      width:100%;
      flex:1;
    }

    .update-form button{
      flex:0 0 auto;
    }

    .submitted{
      margin-top:8px;
      font-size:12px;
      color:#4e7a52;
    }

    .verify{
      font-size:11px;
      margin-top:10px;
      color:#4e7a52;
    }

    .empty{
      grid-column:1/-1;
      padding:45px;
      text-align:center;
      color:var(--muted);
    }

    .note{
      max-width:1100px;
      margin:0 auto 25px;
      padding:0 22px;
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
    }

    @media(max-width:600px){
      h1{font-size:25px}
      .grid{grid-template-columns:1fr}
    }
  </style>
</head>

<body>
  <div id="app">
    <header>
      <h1>🚻 WC Paris — Codes</h1>

      <div class="sub">
        Le raccourci pour trouver les toilettes des fast-foods et cafés, avec le dernier code connu.
      </div>

      <div class="bar">
        <input id="q" placeholder="Rechercher une adresse, un quartier…">

        <select id="sort">
          <option value="recent">Plus récemment vérifié</option>
          <option value="brand">Enseigne</option>
        </select>
      </div>
    </header>

    <div class="brands" id="brands"></div>

    <div class="stats" id="stats"></div>

    <main class="grid" id="grid"></main>

    <div class="note">
      Les codes peuvent changer. Un code affiché ici est une information communautaire et doit être vérifié sur place.
      Si le restaurant imprime un code sur le ticket, celui-ci prévaut.
    </div>
  </div>

  <script>
    /* GitHub Pages-ready: single-file static site, no build step or server required. */

    const data = [

      {b:'Starbucks',a:'83 Rue St Charles, 75015 Paris',c:null,v:null,s:'à vérifier'},
      {b:'Starbucks',a:'43 Avenue Félix Faure, 75015 Paris',c:null,v:null,s:'à vérifier'},
      {b:'Starbucks',a:'66 Avenue de la Motte-Picquet, 75015 Paris',c:null,v:null,s:'à vérifier'},
      {b:'Starbucks',a:'297 Rue de Vaugirard, 75015 Paris',c:null,v:null,s:'à vérifier'},
      {b:'Starbucks',a:'90 Avenue Victor Hugo, 75016 Paris',c:null,v:null,s:'à vérifier'},
      {b:'Starbucks',a:'23 Avenue de Wagram, 75017 Paris',c:null,v:null,s:'à vérifier'},

      {b:'Popeyes',a:'15 Place de la République, 75003 Paris',c:'C3589',v:'2026-10-06',s:'confirmé utilisateur'},
      {b:'Popeyes',a:'9 Boulevard de Denain, 75010 Paris',c:null,v:null,s:'à vérifier'},
      {b:'Popeyes',a:'42 Avenue d’Italie, 75013 Paris',c:null,v:null,s:'à vérifier'},
      {b:'Popeyes',a:'1 Rue de Steinkerque, 75018 Paris',c:null,v:null,s:'à vérifier'}
    ];

    let brand = 'Tous';

    const brands = [
      'Tous',
      'McDonald’s',
      'KFC',
      'Burger King',
      'Starbucks',
      'Popeyes'
    ];

    const bEl = document.getElementById('brands');

    brands.forEach(x => {
      let d = document.createElement('button');

      d.className = 'brand' + (x === 'Tous' ? ' active' : '');

      d.textContent = x;

      d.onclick = () => {
        brand = x;

        document
          .querySelectorAll('.brand')
          .forEach(z => z.classList.remove('active'));

        d.classList.add('active');

        render();
      };

      bEl.appendChild(d);
    });

    document.getElementById('q').oninput = render;
    document.getElementById('sort').onchange = render;

    function render() {
      let q = document
        .getElementById('q')
        .value
        .toLowerCase();

      let arr = data.filter(x =>
        (brand === 'Tous' || x.b === brand) &&
        (x.a + ' ' + x.b).toLowerCase().includes(q)
      );

      if (document.getElementById('sort').value === 'brand') {
        arr.sort((x,y) => x.b.localeCompare(y.b));
      } else {
        arr.sort((x,y) => (y.v || '').localeCompare(x.v || ''));
      }

      document.getElementById('stats').textContent =
        `${arr.length} lieux · ${arr.filter(x => x.c).length} codes connus · Paris`;

      document.getElementById('grid').innerHTML =
        arr.length
        ? arr.map(x => `
          <article class="card">

            <div class="top">
              <div>
                <div class="name">${x.b}</div>
                <div class="addr">${x.a}</div>
              </div>

              <div class="logo">
                ${x.c ? 'CODE' : 'INFO'}
              </div>
            </div>

            <div class="code">
              ${x.c || '<span class="unknown">Code inconnu</span>'}
            </div>

            <div class="meta">
              ${
                x.c
                ? 'Dernière vérification : ' + x.v
                : 'Besoin d’une vérification communautaire'
              }
            </div>

            <div class="update-form">
              <input
                id="update-${data.indexOf(x)}"
                maxlength="30"
                autocomplete="off"
                placeholder="Nouveau code…"
                aria-label="Nouveau code pour ${x.b} ${x.a}"
              >
              <button type="button" onclick="submitUpdate(${data.indexOf(x)})">提交</button>
            </div>
            <div class="submitted" id="submitted-${data.indexOf(x)}"></div>

            <div class="verify">
              ● ${x.s}
            </div>

          </article>
        `).join('')
        : `
          <div class="empty">
            Aucun résultat. Essaie un autre quartier ou une autre enseigne.
          </div>
        `;
    }

    function submitUpdate(index) {
      const input = document.getElementById('update-' + index);
      const msg = document.getElementById('submitted-' + index);
      const code = input.value.trim();

      if (!code) {
        msg.textContent = '请输入新密码。';
        return;
      }

      const submissions = JSON.parse(localStorage.getItem('wcParisSubmissions') || '[]');
      submissions.push({
        brand: data[index].b,
        address: data[index].a,
        code,
        submittedAt: new Date().toISOString()
      });
      localStorage.setItem('wcParisSubmissions', JSON.stringify(submissions));

      input.value = '';
      msg.textContent = '✓ 已提交（测试版：暂存在此设备）';
    }

    render();
  </script>
</body>
</html>
