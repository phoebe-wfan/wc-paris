    function normalizeText(value='') {
      return value
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g,'')
        .toLowerCase()
        .replace(/[^a-z0-9]/g,'');
    }

    function distanceFromUser(item) {
      if (!userLatLng || !item || !item._latlng) return null;
      return map.distance(userLatLng, item._latlng);
    }

    function formatDistance(meters) {
      if (!Number.isFinite(meters)) return '';
      if (meters < 1000) {
        const rounded = Math.max(10, Math.round(meters / 10) * 10);
        return rounded + ' m';
      }
      return (meters / 1000).toLocaleString('fr-FR', {
        minimumFractionDigits: meters < 10000 ? 1 : 0,
        maximumFractionDigits: 1
      }) + ' km';
    }

    function distanceBadge(item) {
      const meters = distanceFromUser(item);
      return meters === null ? '' : '<div class="distance-badge">📍 ' + t('distance') + ' ' + formatDistance(meters) + '</div>';
    }

    function sortNearestFirst(items) {
      if (!userLatLng) return items;
      return [...items].sort((a,b) => {
        const da = distanceFromUser(a);
        const db = distanceFromUser(b);
        return (da === null ? Infinity : da) - (db === null ? Infinity : db);
      });
    }

    const map = L.map('map').setView([48.8566, 2.3522], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom:19,
      attribution:'&copy; OpenStreetMap contributors'
    }).addTo(map);
    const markerLayer = L.layerGroup().addTo(map);
    const userLayer = L.layerGroup().addTo(map);
    let geocodeBusy = false;
    let mapVisible = false;
    let userLatLng = null;
    let lastMapItems = [];
    let lastMapIsCode = false;

    function getLatLng(r){
      const p = r.geo_point_2d || r.coordonnees_geo || r.coordinates || null;
      if (p && typeof p === 'object') {
        const lat = p.lat ?? p.latitude ?? (Array.isArray(p.coordinates) ? p.coordinates[1] : null);
        const lon = p.lon ?? p.lng ?? p.longitude ?? (Array.isArray(p.coordinates) ? p.coordinates[0] : null);
        if (Number.isFinite(Number(lat)) && Number.isFinite(Number(lon))) return [Number(lat),Number(lon)];
      }
      if (r.geometry && Array.isArray(r.geometry.coordinates)) {
        return [Number(r.geometry.coordinates[1]), Number(r.geometry.coordinates[0])];
      }
      return null;
    }

    function updateMap(items, isCode=false){
      lastMapItems = items;
      lastMapIsCode = isCode;

      if (!mapVisible) return;

      markerLayer.clearLayers();
      const pts = [];

      items.forEach(x => {
        const ll = x._latlng || null;
        if (!ll) return;
        const title = isCode ? (x.b + ' — ' + x.a) : (x.name + ' — ' + x.address);
        const extra = isCode && x.c ? '<br><strong>Code : ' + x.c + '</strong>' : '';
        L.marker(ll).addTo(markerLayer).bindPopup(title + extra);
        pts.push(ll);
      });

      userLayer.clearLayers();

      if (userLatLng) {
        L.circleMarker(userLatLng, {
          radius:8,
          weight:3,
          fillOpacity:1
        }).addTo(userLayer).bindPopup(t('youAreHere'));

        const nearby = pts
          .map(ll => ({ll, distance: map.distance(userLatLng, ll)}))
          .sort((a,b) => a.distance - b.distance)
          .slice(0, 20);

        const bounds = [userLatLng, ...nearby.map(x => x.ll)];
        if (bounds.length > 1) map.fitBounds(bounds, {padding:[30,30], maxZoom:16});
        else map.setView(userLatLng, 16);
      } else if (pts.length === 1) {
        map.setView(pts[0], 16);
      } else if (pts.length > 1) {
        map.fitBounds(pts, {padding:[24,24], maxZoom:15});
      } else {
        map.setView([48.8566,2.3522],12);
      }

      setTimeout(() => map.invalidateSize(), 50);
    }

    function showNearbyToilets(){
      const status = document.getElementById('locationStatus');
      const mapEl = document.getElementById('map');

      if (mapVisible) {
        mapVisible = false;
        mapEl.style.display = 'none';
        status.textContent = '';
        return;
      }

      if (userLatLng) {
        mapVisible = true;
        mapEl.style.display = 'block';
        status.textContent = 'Position trouvée · WC proches affichés sur la carte.';
        updateMap(lastMapItems, lastMapIsCode);
        render();
        setTimeout(() => map.invalidateSize(), 50);
        return;
      }

      if (!navigator.geolocation) {
        status.textContent = 'La géolocalisation n’est pas disponible sur cet appareil.';
        return;
      }

      status.textContent = 'Recherche de votre position…';

      navigator.geolocation.getCurrentPosition(
        position => {
          userLatLng = [position.coords.latitude, position.coords.longitude];
          mapVisible = true;
          mapEl.style.display = 'block';
          status.textContent = 'Position trouvée · WC proches affichés sur la carte.';
          updateMap(lastMapItems, lastMapIsCode);
          render();
          setTimeout(() => map.invalidateSize(), 50);
        },
        () => {
          status.textContent = 'Impossible d’accéder à votre position. Autorisez la localisation dans Safari puis réessayez.';
        },
        {enableHighAccuracy:true, timeout:10000, maximumAge:60000}
      );
    }

    document.getElementById('nearbyBtn').addEventListener('click', showNearbyToilets);

    function geocodeCache(){
      try { return JSON.parse(localStorage.getItem('wcParisGeocodes') || '{}'); }
      catch(e){ return {}; }
    }

    async function geocodeCodeToilets(items){
      if (geocodeBusy) return;
      const missing = items.filter(x => !x._latlng);
      if (!missing.length) return;

      geocodeBusy = true;
      const cache = geocodeCache();

      for (const x of missing) {
        const key = x.b + '|' + x.a;

        if (cache[key]) {
          x._latlng = cache[key];
          continue;
        }

        try {
          const query = encodeURIComponent(x.b + ', ' + x.a + ', France');
          const res = await fetch(
            'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=fr&q=' + query,
            {headers:{'Accept':'application/json'}}
          );
          const found = await res.json();
          if (found && found[0]) {
            x._latlng = [Number(found[0].lat), Number(found[0].lon)];
            cache[key] = x._latlng;
            localStorage.setItem('wcParisGeocodes', JSON.stringify(cache));
            updateMap(items, true);
          }
        } catch(e) {}

        await new Promise(r => setTimeout(r, 1100));
      }

      geocodeBusy = false;
      updateMap(items, true);
      if (userLatLng) render();
    }

    async function loadMetroToilets() {
      metroLoading = true;
      metroLoadError = false;
      render();

      try {
        const url = 'https://data.iledefrance-mobilites.fr/api/explore/v2.1/catalog/datasets/sanitaires-reseau-ratp/records?limit=100';
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const json = await res.json();

        metroToilets = (json.results || []).map(r => ({
          kind:'metro',
          operator:'RATP',
          station:r.station || 'Station RATP',
          line:r.ligne ? 'Ligne ' + r.ligne : 'Ligne non renseignée',
          access:[
            r.accessible_au_public ? 'Accessible au public : ' + r.accessible_au_public : null,
            r.acces_passe_navigo_ou_ticket_t ? 'Titre de transport : ' + r.acces_passe_navigo_ou_ticket_t : null
          ].filter(Boolean).join(' · '),
          tariff:r.tarif_gratuit_payant || 'Tarif non renseigné',
          pmr:r.accessibilite_pmr === 'oui' ? true : (r.accessibilite_pmr === 'non' ? false : null),
          count:null,
          location:r.localisation || t('locationUnknown'),
          source:'RATP / Île-de-France Mobilités Open Data',
          _latlng:getLatLng({geo_point_2d:r.coord_geo})
        }));

        // Keep current RATP information that is more recent than the legacy open-data row when known.
        const troc = metroToilets.find(x => normalizeText(x.station).includes('trocadero'));
        if (troc) {
          troc.count = 9;
          troc.tariff = 'Payant · 1 €';
          troc.access = 'Sortie 1, avenue du Président-Wilson · 8h–20h';
          troc.source = 'RATP · information 2026';
        }

        metroToilets.push(...sncfToilets.filter(x =>
          !metroToilets.some(y => normalizeText(y.operator + y.station) === normalizeText(x.operator + x.station))
        ));
      } catch (e) {
        metroLoadError = true;
        metroToilets = [...sncfToilets];
      } finally {
        metroLoading = false;
      }
    }

    async function loadPublicToilets() {
      publicLoading = true;
      publicLoadError = false;
      render();
      try {
        const rows = [];
        for (let offset = 0; offset < 700; offset += 100) {
          const url = 'https://opendata.paris.fr/api/explore/v2.1/catalog/datasets/sanisettesparis/records?limit=100&offset=' + offset;
          const res = await fetch(url);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const json = await res.json();
          rows.push(...(json.results || []));
          if (!json.results || json.results.length < 100) break;
        }
        publicToilets = rows.map(r => {
          const type = String(r.type || '').toLowerCase();
          return {
          kind: type.includes('sanisette') ? 'sanisette' : (type === 'lavatory' ? 'paid' : 'free'),
          name: r.type || 'Toilettes publiques',
          address: [r.adresse, r.arrondissement].filter(Boolean).join(', '),
          access: r.statut && r.statut !== 'En service' ? r.statut : null,
          pmr: r.acces_pmr === 'Oui' ? true : (r.acces_pmr === 'Non' ? false : null),
          baby: r.relais_bebe === 'Oui',
          hours: r.horaire || null,
          source: 'Ville de Paris — Paris Data',
          _latlng: getLatLng(r)
        };
        });
      } catch (e) {
        publicLoadError = true;
      } finally {
        publicLoading = false;
      }
    }

    function render() {
      const q = normalizeText(document.getElementById('q').value);

      if (category === 'code') {
        let arr = data.filter(x =>
          (brand === 'Tous' || x.b === brand) &&
          normalizeText(x.a + ' ' + x.b).includes(q)
        );

        if (userLatLng) {
          arr = sortNearestFirst(arr);
        } else if (document.getElementById('sort').value === 'brand') {
          arr.sort((x,y) => x.b.localeCompare(y.b));
        } else {
          arr.sort((x,y) => (y.v || '').localeCompare(x.v || ''));
        }

        document.getElementById('stats').textContent =
          arr.length + ' ' + t('places') + ' · ' + arr.filter(x => x.c).length + ' ' + t('knownCodes') + ' · Paris';
        updateMap(arr, true);
        geocodeCodeToilets(arr);

        const submissions = JSON.parse(localStorage.getItem('wcParisSubmissions') || '[]');

        document.getElementById('grid').innerHTML =
          arr.length
          ? arr.map(x => {
            const local = submissions
              .filter(s => s.brand === x.b && s.address === x.a)
              .map(s => ({code:s.code,date:s.submittedAt,label:t('userSubmitted')}));

            const history = [
              ...(x.c ? [{code:x.c,date:x.v,label:x.s}] : []),
              ...local
            ].sort((a,b)=>(b.date||'').localeCompare(a.date||''));

            const latest = history[0] || null;

            return `
              <article class="card">
                <div class="top">
                  <div>
                    <div class="name">${x.b}</div>
                    <div class="addr">${x.a}</div>
                    ${distanceBadge(x)}
                  </div>
                  <div class="logo">${latest ? 'CODE' : 'INFO'}</div>
                </div>

                <div class="code">${latest ? latest.code : '<span class="unknown">' + t('unknownCode') + '</span>'}</div>

                <div class="meta">
                  ${latest
                    ? t('lastUpdate') + ' : ' + (latest.date ? new Date(latest.date).toLocaleString('fr-FR') : t('unknownDate'))
                    : t('needsCheck')}
                </div>

                <div class="update-form">
                  <input
                    id="update-${data.indexOf(x)}"
                    maxlength="30"
                    autocomplete="off"
                    placeholder="${t('newCode')}"
                    aria-label="Nouveau code pour ${x.b} ${x.a}">
                  <button type="button" onclick="submitUpdate(${data.indexOf(x)})">OK</button>
                </div>
                <div class="submitted" id="submitted-${data.indexOf(x)}"></div>

                ${history.length ? `
                  <div class="history">
                    <div class="history-title">${t('history')}</div>
                    ${history.map(h => `
                      <div class="history-item">
                        <span class="history-code">${h.code}</span>
                        <span>${h.date ? new Date(h.date).toLocaleDateString('fr-FR') : t('unknownDate')} · ${h.label}</span>
                      </div>
                    `).join('')}
                  </div>
                ` : ''}

                <div class="verify">● ${x.s}</div>
              </article>
            `;
          }).join('')
          : '<div class="empty">' + t('noResult') + '</div>';
        return;
      }

      if (category === 'public') {
        let arr = publicPlaceToilets
          .filter(x => normalizeText(
            x.name + ' ' + x.address + ' ' + (x.access || '')
          ).includes(q));

        arr = userLatLng
          ? sortNearestFirst(arr)
          : arr.sort((a,b) => a.name.localeCompare(b.name));

        document.getElementById('stats').textContent =
          arr.length + ' ' + t('publicPlaces') + ' · Paris';

        updateMap(arr, false);

        document.getElementById('grid').innerHTML = arr.length
          ? arr.map(x => `
            <article class="card">
              <div class="top">
                <div>
                  <div class="name">${x.name}</div>
                  <div class="addr">${x.address}</div>
                  ${distanceBadge(x)}
                </div>
                <div class="logo">${x.type || 'PUBLIC'}</div>
              </div>

              <div class="meta" style="margin-top:16px">
                ${x.hours ? t('hours') + ' : ' + x.hours : t('hoursUnknown')}
              </div>

              <div class="meta">
                ${x.pmr === true ? '♿ ' + t('accessible') : t('accessibilityUnknown')}
              </div>

              <div class="access-note">🚻 ${x.access}</div>

              <div class="source">Source : ${x.source}</div>
            </article>
          `).join('')
          : '<div class="empty">Aucun lieu public trouvé.</div>';
        return;
      }

      if (category === 'commerce') {
        let arr = commerceToilets
          .filter(x => normalizeText(
            x.name + ' ' + x.address + ' ' + (x.price || '') + ' ' +
            (x.member || '') + ' ' + (x.access || '')
          ).includes(q));

        arr = userLatLng
          ? sortNearestFirst(arr)
          : arr.sort((a,b) => a.name.localeCompare(b.name));

        document.getElementById('stats').textContent =
          arr.length + ' ' + t('shopping');

        updateMap(arr, false);

        document.getElementById('grid').innerHTML = arr.length
          ? arr.map(x => `
            <article class="card">
              <div class="top">
                <div>
                  <div class="name">${x.name}</div>
                  <div class="addr">${x.address}</div>
                  ${distanceBadge(x)}
                </div>
                <div class="logo">${x.price}</div>
              </div>

              <div class="meta" style="margin-top:16px">🕒 ${x.hours || t('hoursUnknown')}</div>
              <div class="access-note">🎟 ${x.member || t('memberUnknown')}</div>
              <div class="meta" style="margin-top:8px">📍 ${x.access || t('locationUnknown')}</div>
              <div class="meta">${x.pmr === true ? '♿ ' + t('accessible') : '♿ ' + t('pmrUnknown')}</div>
              <div class="source">Source : ${x.source}</div>
            </article>
          `).join('')
          : '<div class="empty">Aucun centre commercial trouvé.</div>';
        return;
      }

      if (category === 'metro') {
        if (metroLoading) {
          document.getElementById('stats').textContent = t('loadingTransit');
          document.getElementById('grid').innerHTML = '<div class="empty">' + t('loadingTransitGrid') + '</div>';
          return;
        }

        let arr = metroToilets
          .filter(x => normalizeText(
            (x.operator || '') + ' ' +
            (x.station || '') + ' ' +
            (x.line || '') + ' ' +
            (x.location || '') + ' ' +
            (x.tariff || '')
          ).includes(q));

        arr = userLatLng
          ? sortNearestFirst(arr)
          : arr.sort((a,b) => (a.station || '').localeCompare(b.station || ''));

        document.getElementById('stats').textContent =
          arr.length + ' ' + t('transitCount') + ' · RATP + SNCF';

        updateMap(arr.map(x => ({
          ...x,
          name:(x.operator || '') + ' · ' + (x.station || ''),
          address:x.location || ''
        })), false);

        document.getElementById('grid').innerHTML = arr.length
          ? arr.map(x => `
            <article class="card">
              <div class="top">
                <div>
                  <div class="name">${x.operator || 'Transport'} · ${x.station}</div>
                  <div class="addr">${x.line || ''}</div>
                  ${distanceBadge(x)}
                </div>
                <div class="logo">${x.tariff || 'Tarif ?'}</div>
              </div>

              <div class="meta" style="margin-top:16px">
                📍 ${x.location || t('locationUnknown')}
              </div>

              <div class="meta">
                ${x.pmr === true ? '♿ ' + t('accessible') : (x.pmr === false ? '♿ Non PMR' : '♿ ' + t('pmrUnknown'))}
              </div>

              <div class="access-note">
                🚻 ${x.count ? x.count + ' ' + t('toiletsReported') : 'Nombre de toilettes non renseigné'}
              </div>

              ${x.access ? '<div class="meta" style="margin-top:8px">' + x.access + '</div>' : ''}

              <div class="source">Source : ${x.source}</div>
            </article>
          `).join('')
          : '<div class="empty">' +
              (metroLoadError
                ? t('transitUnavailable')
                : t('noTransit')) +
            '</div>';
        return;
      }

      if (publicLoading) {
        document.getElementById('stats').textContent = t('loadingPublic');
        document.getElementById('grid').innerHTML = '<div class="empty">' + t('loadingPublicGrid') + '</div>';
        return;
      }

      let arr = [...publicToilets, ...extraToilets]
        .filter(x => x.kind === category)
        .filter(x => normalizeText(x.name + ' ' + x.address + ' ' + (x.access || '')).includes(q));

      arr = userLatLng
        ? sortNearestFirst(arr)
        : arr.sort((a,b) => a.address.localeCompare(b.address));

      const categoryLabel =
        category === 'sanisette' ? ' ' + t('sanisettes') :
        category === 'free' ? ' ' + t('freeToilets') :
        ' ' + t('paidToilets');

      document.getElementById('stats').textContent =
        arr.length + categoryLabel + ' · Paris';
      updateMap(arr, false);

      document.getElementById('grid').innerHTML = arr.length
        ? arr.map(x => `
          <article class="card">
            <div class="top">
              <div>
                <div class="name">${x.name}</div>
                <div class="addr">${x.address || t('addressUnknown')}</div>
                ${distanceBadge(x)}
              </div>
              <div class="logo">${category === 'sanisette' ? 'SANISSETTE' : (category === 'free' ? 'GRATUIT' : 'PAYANT')}</div>
            </div>

            <div class="meta" style="margin-top:16px">
              ${x.hours ? t('hours') + ' : ' + x.hours : t('hoursUnknown')}
            </div>

            <div class="meta">
              ${x.pmr === true ? '♿ ' + t('accessible') : (x.pmr === false ? 'Non indiqué PMR' : t('accessibilityUnknown'))}
              ${x.baby ? ' · 👶 ' + t('baby') : ''}
            </div>

            ${x.access ? '<div class="access-note">⚠️ ' + x.access + '</div>' : ''}

            <div class="source">Source : ${x.source}</div>
          </article>
        `).join('')
        : '<div class="empty">' +
            (publicLoadError
              ? t('publicUnavailable')
              : t('noCategory')) +
          '</div>';
    }

    function submitUpdate(index) {
      const input = document.getElementById('update-' + index);
      const msg = document.getElementById('submitted-' + index);
      const code = input.value.trim();

      if (!code) {
        msg.textContent = t('enterCode');
        return;
      }

      const submissions = JSON.parse(localStorage.getItem('wcParisSubmissions') || '[]');
      submissions.push({
        brand: data[index].b,
        address: data[index].a,
        code,
        submittedAt: new Date().toISOString()
      });
      localStorage.setItem('wcParisSubmissions', JSON.stringify(submissions));

      input.value = '';
      msg.textContent = t('saved');
      render();
    }

    applyLanguage();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
